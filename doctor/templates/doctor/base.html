{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Doctor Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Inter',sans-serif;

            background:
            linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
            );

        }

        .sidebar{

            position:fixed;

            top:0;
            left:0;

            width:260px;
            height:100vh;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e293b
            );

            padding:30px 18px;

            color:white;

        }

        .profile-box{

            text-align:center;

            margin-bottom:30px;

            border-bottom:
            1px solid rgba(255,255,255,0.1);

            padding-bottom:25px;

        }

        .profile-box img{

            width:90px;
            height:90px;

            border-radius:50%;

            margin-bottom:12px;

        }

        .sidebar a,
        .sidebar button{

            width:100%;

            display:block;

            padding:14px 18px;

            margin-bottom:12px;

            border:none;

            border-radius:14px;

            background:none;

            color:#cbd5e1;

            text-decoration:none;

            transition:0.3s;

        }

        .sidebar a:hover,
        .sidebar button:hover{

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            color:white;

            transform:translateX(5px);

        }

        .main-content{

            margin-left:260px;

            padding:40px;

        }

        .glass-card{

            background:white;

            border-radius:24px;

            padding:30px;

            box-shadow:
            0 10px 25px rgba(0,0,0,0.08);

        }

        .page-title{

            font-size:2.5rem;

            font-weight:800;

            color:#0f172a;

            margin-bottom:30px;

        }

        .custom-btn{

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            border:none;

            color:white;

            padding:12px 22px;

            border-radius:14px;

            font-weight:600;

        }

        table{

            border-radius:18px;

            overflow:hidden;

        }

        thead{

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            color:white;

        }

    </style>

</head>

<body>

<div class="sidebar">

    <div class="profile-box">

        <img
            src="https://placehold.co/100x100/2563eb/ffffff?text=DR"
        >

        <h5>
            Dr. {{ request.user.username }}
        </h5>

        <p class="small text-light">

            {{ doctor.specialization }}

        </p>

    </div>

    <a href="{% url 'doctor_dashboard' %}">
        🏠 Dashboard
    </a>

    <a href="{% url 'doctor_profile' %}">
        👤 Profile
    </a>

    <a href="{% url 'doctor_appointments' %}">
        📅 Appointments
    </a>

    <form method="post" action="{% url 'logout' %}">

        {% csrf_token %}

        <button type="submit">

            🚪 Logout

        </button>

    </form>

</div>

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

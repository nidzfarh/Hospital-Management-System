{% extends 'adminpanel/base.html' %}

{% block content %}

<div class="table-card">

    <h2 class="fw-bold mb-4">

        Doctors

    </h2>

    <table class="table">

        <thead>

            <tr>

                <th>Name</th>
                <th>Specialization</th>
                <th>Experience</th>

            </tr>

        </thead>

        <tbody>

            {% for doctor in doctors %}

            <tr>

                <td>

                    {{ doctor.fullname }}

                </td>

                <td>

                    {{ doctor.specialization }}

                </td>

                <td>

                    {{ doctor.experience }} Years

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}

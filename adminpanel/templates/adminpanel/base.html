<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HMS Admin Panel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <style>

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        body{

            font-family:'Inter',sans-serif;

            background:
            linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
            );

            min-height:100vh;

        }

        /* SIDEBAR */

        .sidebar{

            position:fixed;

            top:0;
            left:0;

            width:270px;
            height:100vh;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e293b
            );

            padding:35px 20px;

            display:flex;

            flex-direction:column;

            justify-content:space-between;

            box-shadow:
            5px 0 20px rgba(0,0,0,0.08);

            z-index:1000;

        }

        .logo-section h2{

            color:white;

            font-size:2rem;

            font-weight:800;

            margin-bottom:10px;

        }

        .logo-section p{

            color:#94a3b8;

            font-size:0.95rem;

            margin-bottom:40px;

        }

        /* NAVIGATION */

        .nav-links a{

            display:flex;

            align-items:center;

            gap:14px;

            color:#cbd5e1;

            text-decoration:none;

            padding:15px 18px;

            margin-bottom:14px;

            border-radius:18px;

            font-weight:600;

            transition:0.3s;

            font-size:1rem;

        }

        .nav-links a:hover{

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            color:white;

            transform:translateX(5px);

        }

        .logout-btn{

            background:
            linear-gradient(
            135deg,
            #ef4444,
            #f97316
            );

            color:white !important;

        }

        .logout-btn:hover{

            opacity:0.9;

            transform:none !important;

        }

        /* MAIN */

        .main-content{

            margin-left:270px;

            padding:40px;

        }

        /* TOPBAR */

        .topbar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:40px;

        }

        .topbar h1{

            font-size:2rem;

            font-weight:800;

            color:#0f172a;

        }

        .topbar p{

            color:#64748b;

            margin-top:5px;

        }

        /* PROFILE */

        .admin-profile{

            background:white;

            padding:12px 18px;

            border-radius:18px;

            display:flex;

            align-items:center;

            gap:12px;

            box-shadow:
            0 8px 20px rgba(0,0,0,0.05);

        }

        .admin-avatar{

            width:45px;
            height:45px;

            border-radius:50%;

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            display:flex;

            justify-content:center;

            align-items:center;

            color:white;

            font-weight:700;

            font-size:1.1rem;

        }

        /* TABLE CARD */

        .table-card{

            background:white;

            border-radius:24px;

            padding:30px;

            box-shadow:
            0 10px 25px rgba(0,0,0,0.06);

        }

        table{

            border-collapse:separate;

            border-spacing:0 12px;

        }

        thead th{

            border:none !important;

            color:#64748b;

            font-size:0.95rem;

            font-weight:700;

        }

        tbody tr{

            background:#f8fafc;

            border-radius:18px;

            transition:0.3s;

        }

        tbody tr:hover{

            transform:scale(1.01);

            background:#eef4ff;

        }

        tbody td{

            padding:18px !important;

            border:none !important;

            vertical-align:middle;

        }

        /* RESPONSIVE */

        @media(max-width:992px){

            .sidebar{

                width:100%;

                height:auto;

                position:relative;

            }

            .main-content{

                margin-left:0;

            }

            .topbar{

                flex-direction:column;

                align-items:flex-start;

                gap:20px;

            }

        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div>

        <div class="logo-section">

            <h2>

                HMS Admin

            </h2>

            <p>

                Hospital Management System

            </p>

        </div>

        <div class="nav-links">

            <a href="{% url 'admin_dashboard' %}">

                📊 Dashboard

            </a>

            <a href="{% url 'admin_doctors' %}">

                👨‍⚕️ Doctors

            </a>

            <a href="{% url 'admin_patients' %}">

                🧑‍🤝‍🧑 Patients

            </a>

            <a href="{% url 'admin_appointments' %}">

                📅 Appointments

            </a>

        </div>

    </div>

    <div class="nav-links">

        <a
            href="{% url 'logout' %}"
            class="logout-btn"
        >

            🚪 Logout

        </a>

    </div>

</div>

<!-- MAIN CONTENT -->

<div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h1>

                Admin Dashboard

            </h1>

            <p>

                Manage doctors, patients and appointments

            </p>

        </div>

        <div class="admin-profile">

            <div class="admin-avatar">

                A

            </div>

            <div>

                <strong>

                    Admin

                </strong>

                <br>

                <small class="text-muted">

                    System Administrator

                </small>

            </div>

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

{% extends 'adminpanel/base.html' %}

{% block content %}

<div class="table-card">

    <h2 class="fw-bold mb-4">

        Appointments

    </h2>

    <table class="table">

        <thead>

            <tr>

                <th>Patient</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Reason</th>

            </tr>

        </thead>

        <tbody>

            {% for booking in bookings %}

            <tr>

                <td>

                    {{ booking.patient_full_name }}

                </td>

                <td>

                    {{ booking.doctor.fullname }}

                </td>

                <td>

                    {{ booking.date }}

                </td>

                <td>

                    {{ booking.reason }}

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}

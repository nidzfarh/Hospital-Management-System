{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HMS Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <style>

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        body{

            font-family:'Inter',sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(
            135deg,
            #eff6ff,
            #dbeafe
            );

            overflow:hidden;

        }

        .bg-circle{

            position:absolute;

            width:350px;
            height:350px;

            background:#2563eb;

            border-radius:50%;

            filter:blur(120px);

            opacity:0.18;

        }

        .circle1{

            top:-100px;
            left:-100px;

        }

        .circle2{

            bottom:-100px;
            right:-100px;

        }

        .login-card{

            width:100%;

            max-width:430px;

            background:white;

            padding:45px;

            border-radius:30px;

            box-shadow:
            0 15px 40px rgba(0,0,0,0.08);

            position:relative;

            z-index:2;

        }

        .login-title{

            font-size:2.4rem;

            font-weight:800;

            color:#0f172a;

            margin-bottom:10px;

        }

        .login-subtitle{

            color:#64748b;

            margin-bottom:35px;

        }

        .form-control{

            border-radius:14px;

            padding:14px;

            border:1px solid #dbeafe;

            margin-bottom:20px;

        }

        .form-control:focus{

            border-color:#2563eb;

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.1);

        }

        .btn-login{

            width:100%;

            border:none;

            padding:14px;

            border-radius:14px;

            font-weight:700;

            color:white;

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
            );

            transition:0.3s;

        }

        .btn-login:hover{

            transform:translateY(-2px);

            box-shadow:
            0 10px 20px rgba(37,99,235,0.2);

        }

        .register-link{

            text-align:center;

            margin-top:25px;

            color:#64748b;

        }

        .register-link a{

            text-decoration:none;

            font-weight:600;

            color:#2563eb;

        }

        .alert{

            border-radius:14px;

        }

    </style>

</head>

<body>

<div class="bg-circle circle1"></div>

<div class="bg-circle circle2"></div>

<div class="login-card">

    <h1 class="login-title">

        HMS Login

    </h1>

    <p class="login-subtitle">

        Welcome back! Please login to continue.

    </p>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <form
        method="POST"
        action="{% url 'login_page' %}"
    >

        {% csrf_token %}

        <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
        >

        <button
            type="submit"
            class="btn-login"
        >

            Login

        </button>

    </form>

    <div class="register-link">

        Don’t have an account?

        <a href="{% url 'registration_page' %}">

            Register

        </a>

    </div>

</div>

</body>
</html>

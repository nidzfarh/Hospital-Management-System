<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS Patient Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;
            background:#f1f5f9;
            overflow-x:hidden;
        }

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            width:260px;
            height:100vh;
            background:linear-gradient(180deg,#0f172a,#1e293b);
            padding:30px 18px;
            color:white;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:40px;
            font-weight:800;
        }

        .sidebar a,
        .sidebar button{
            width:100%;
            display:block;
            padding:14px 18px;
            margin-bottom:12px;
            border:none;
            border-radius:12px;
            background:none;
            color:#cbd5e1;
            text-decoration:none;
            transition:0.3s;
            font-weight:500;
        }

        .sidebar a:hover,
        .sidebar button:hover{
            background:rgba(255,255,255,0.1);
            color:white;
        }

        .main-content{
            margin-left:260px;
            padding:40px;
        }

        .glass-card{
            background:white;
            border-radius:24px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .page-title{
            font-size:2rem;
            font-weight:800;
            margin-bottom:30px;
            color:#0f172a;
        }

        .custom-btn{
            background:linear-gradient(135deg,#2563eb,#06b6d4);
            color:white;
            border:none;
            padding:12px 22px;
            border-radius:12px;
            font-weight:600;
            transition:0.3s;
        }

        .custom-btn:hover{
            transform:translateY(-2px);
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }

        .table{
            overflow:hidden;
            border-radius:18px;
        }

        @media(max-width:768px){

            .sidebar{
                position:relative;
                width:100%;
                height:auto;
            }

            .main-content{
                margin-left:0;
                padding:20px;
            }

        }

    </style>

</head>

<body>

<div class="sidebar">

    <h2>HMS Portal</h2>

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'profile' %}">
        Profile
    </a>

    <a href="{% url 'history' %}">
        History
    </a>

    <a href="{% url 'booking' %}">
        Book Appointment
    </a>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">
            Logout
        </button>
    </form>

</div>

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

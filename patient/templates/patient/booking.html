{% extends 'patient/base.html' %}

{% block content %}

<div class="glass-card" style="max-width:850px; margin:auto;">

    <h1 class="page-title text-center">
        Book Appointment
    </h1>

    <!-- Specialization -->

    <form method="get" class="mb-4">

        <label class="fw-bold mb-2">
            Select Specialization
        </label>

        <select
            name="specialization"
            class="form-select p-3 rounded-4"
            onchange="this.form.submit()"
        >

            <option value="">
                Choose Specialization
            </option>

            {% for spec in specializations %}

            <option
                value="{{ spec }}"
                {% if specialization == spec %}selected{% endif %}
            >
                {{ spec }}
            </option>

            {% endfor %}

        </select>

    </form>

    {% if form %}

    <form method="post">

        {% csrf_token %}

        <!-- Doctor -->

        <div class="mb-4">

            <label class="fw-bold mb-2">
                Select Doctor
            </label>

            <select
                name="doctor"
                class="form-select p-3 rounded-4"
            >

                <option value="">
                    Choose Doctor
                </option>

                {% for doctor in form.fields.doctor.queryset %}

                <option value="{{ doctor.id }}">

                    {{ doctor.fullname }}

                </option>

                {% endfor %}

            </select>

        </div>

        <!-- Date -->

        <div class="mb-4">

            <label class="fw-bold mb-2">
                Appointment Date
            </label>

            {{ form.date }}

        </div>

        <!-- Time -->

        <div class="mb-4">

            <label class="fw-bold mb-2">
                Appointment Time
            </label>

            {{ form.time }}

        </div>

        <!-- Reason -->

        <div class="mb-4">

            <label class="fw-bold mb-2">
                Reason
            </label>

            {{ form.reason }}

        </div>

        <button
            type="submit"
            class="custom-btn w-100"
        >

            Confirm Booking

        </button>

    </form>

    {% endif %}

</div>

<style>

    input,
    select,
    textarea{

        width:100%;
        padding:14px;
        border-radius:16px;
        border:1px solid #dbeafe;
        background:#f8fafc;
        transition:0.3s;

    }

    input:focus,
    select:focus,
    textarea:focus{

        outline:none;
        border-color:#2563eb;
        box-shadow:0 0 0 4px rgba(37,99,235,0.1);

    }

    textarea{
        min-height:120px;
    }

</style>

{% endblock %}
